name: life_companion
description: "Life Companion mobile app — reflection, mind, and health pillars."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # ---- State management ----
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5

  # ---- Routing ----
  go_router: ^14.6.0

  # ---- HTTP ----
  dio: ^5.7.0

  # ---- Firebase ----
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3

  # ---- Local storage ----
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # ---- Codegen base annotations ----
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ---- Misc ----
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ---- Codegen ----
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.2

  # ---- Mocking ----
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
